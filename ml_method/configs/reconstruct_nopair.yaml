# Pairwise-OFF ablation config. Identical to reconstruct_base.yaml except the partner
# head receives NO pairwise partner feature (partner_pair_feat_dim: 0) — the partner head
# then scores edge pairs from [emb_i || emb_j] alone, with no co-clustering signal.
# Used to isolate the contribution of the pairwise co-clustering feature to allo partner
# accuracy on the CURRENT (rooted) model, replacing the stale 0.52 -> 0.80 delta that was
# measured on the old unrooted model.

model:
  node_feat_dim: 13          # 8 copy count + 5 clustering summary
  edge_feat_dim: 9           # 4 base + 5 WGD-detection
  hidden_dim: 64
  n_gat_layers: 3
  n_gat_heads: 4
  dropout: 0.2
  partner_pair_feat_dim: 0    # NO pairwise partner feature (ablation)

training:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 8              # gradient accumulation steps
  max_epochs: 200
  patience: 30
  pos_class_weight: 12.0     # detection class imbalance
  focal_alpha: 0.25
  focal_gamma: 2.0
  partner_weight: 1.0        # weight of the partner cross-entropy vs detection loss
  val_split: 0.2
