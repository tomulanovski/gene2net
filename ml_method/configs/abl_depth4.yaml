# Ablation: n_gat_layers = 4 (else identical to reconstruct_oneparter.yaml)
model:
  node_feat_dim: 13
  edge_feat_dim: 9
  hidden_dim: 64
  n_gat_layers: 4
  n_gat_heads: 4
  dropout: 0.2
  partner_pair_feat_dim: 4
  n_parents: 1
training:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 8
  max_epochs: 200
  patience: 30
  pos_class_weight: 12.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  partner_weight: 1.0
  val_split: 0.2
